  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      =========================================================
       全站合规匿名流量统计（纯前端，零 Cookie / 零后端 / 零隐私抓取）
       全部脚本：defer + requestIdleCallback 延迟注入，不阻塞首屏渲染。
       部署节奏（按第六章要求）：
       · Microsoft Clarity + 不蒜子：现阶段正常接入启用（备案期间兜底统计）
       · Cloudflare Web Analytics：域名备案中，暂不接入埋点；代码位与变量已预留，
         备案审核通过、完成 Cloudflare 域名托管后，仅需替换 CF_TOKEN 即一键启用，无需二次改代码。
      =========================================================
    -->
    <script>
      (function () {
        // 1. Cloudflare Web Analytics（官方 beacon.min.js，无 Cookie、匿名统计）
        // 【状态：备案期间暂不接入】代码位 + 变量已完整预留，备案完成后仅需替换 CF_TOKEN 即启用。
        // 官方文档：https://developers.cloudflare.com/analytics/web-analytics/getting-started/
        var CF_TOKEN = 'MENDFILE_CF_BEACON_TOKEN'; // ← 备案通过后在 Cloudflare 控制台获取 Token 并替换，即一键启用
        function loadCloudflareAnalytics() {
          if (!CF_TOKEN || CF_TOKEN.indexOf('MENDFILE_') === 0) return; // 备案期间（占位符）主动跳过，不加载埋点
          var s = document.createElement('script');
          s.defer = true;
          s.async = true;
          s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
          s.setAttribute('data-cf-beacon', JSON.stringify({ token: CF_TOKEN }));
          s.crossOrigin = 'anonymous';
          document.body.appendChild(s);
        }

        // 2. Microsoft Clarity（免费行为分析：热力图/会话回放/跳出率，无隐私违规）
        // 【状态：现阶段正常接入启用】代码已就绪，仅需填入你的 Project ID 即生效（非备案阻塞，属缺凭证）。
        // 绑定教程：https://clarity.microsoft.com 注册 → 创建项目 → 复制 Project ID（形如 "x1abc2def3"）
        var CLARITY_ID = 'MENDFILE_CLARITY_ID'; // ← 现阶段启用：填入你的 Clarity Project ID 后脚本自动加载
        function loadClarity() {
          if (!CLARITY_ID || CLARITY_ID.indexOf('MENDFILE_') === 0) return; // 未填 ID 时跳过，避免 404；填入真实 ID 即生效
          (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
            t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i;
            t.defer = 1;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
          })(window, document, 'clarity', 'script', CLARITY_ID);
        }

        // 3. 不蒜子极简访问量计数器（前台展示，已启用）— 计数器 DOM 在 SiteFooter 中
        // 官方：https://busuanzi.ibruce.info/  纯前端 JS，无需后端
        function loadBusuanzi() {
          // DOM 里有 busuanzi_value 元素才加载脚本（避免 404），延迟到首屏后
          var has = document.querySelector('[id^=busuanzi_value]') || document.getElementById('busuanzi_container_site_pv');
          if (!has) return;
          var s = document.createElement('script');
          s.async = true;
          s.defer = true;
          s.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
          s.setAttribute('data-swcfga', 'skip'); // 标识，避免 Cloudflare 误拦截
          document.body.appendChild(s);
        }

        // 首屏稳定后再执行：load 事件 + requestIdleCallback 双保险
        function boot() {
          try {
            if (typeof requestIdleCallback === 'function') {
              requestIdleCallback(loadCloudflareAnalytics, { timeout: 3000 });
              requestIdleCallback(loadClarity, { timeout: 3000 });
              requestIdleCallback(loadBusuanzi, { timeout: 3000 });
            } else {
              setTimeout(loadCloudflareAnalytics, 1200);
              setTimeout(loadClarity, 1500);
              setTimeout(loadBusuanzi, 2000);
            }
          } catch (e) { /* 统计失败不影响主站 */ }
        }

        if (document.readyState === 'complete') boot();
        else window.addEventListener('load', boot, { once: true, passive: true });
      })();
    </script>
  </body>
